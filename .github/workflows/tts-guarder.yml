name: TTS Guarder

on:
  workflow_dispatch:
    inputs:
      extra_args:
        description: "extra pytest args (empty = full default suite)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  guarder:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ten-framework/ten_agent_build:0.7.14
    env:
      BREEZE_API_KEY: ${{ secrets.BREEZE_API_KEY }}
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          path: ext

      - name: Checkout TEN framework
        uses: actions/checkout@v4
        with:
          repository: hangdingding/ten-framework
          ref: feat/breeze-tts-extension
          path: ten
          fetch-depth: 1

      - name: Install extension into TEN
        run: |
          dst=ten/ai_agents/agents/ten_packages/extension/breeze_tts_python
          rm -rf "$dst"
          cp -r ext "$dst"
          rm -rf "$dst/.git"

      - name: Install test extras
        run: |
          python3 -m pip install --quiet pytest-asyncio pytest-forked
          # guarder's provider self-tests import these extension modules
          python3 -m pip install --quiet google-cloud-texttospeech==2.27.0 protobuf==5.29.6 dashscope==1.26.4

      - name: Run tts guarder
        run: |
          cd ten/ai_agents
          export PYTHONUNBUFFERED=1
          timeout 1500 task tts-guarder-test EXTENSION=breeze_tts_python CONFIG_DIR=tests/configs -- -v

      - name: Upload PCM dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breeze-pcm
          path: |
            ten/ai_agents/**/keep_dump_output/**
          if-no-files-found: warn

  upstream-ci:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ten-framework/ten_agent_build:0.7.14
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          path: ext

      - name: Checkout TEN framework
        uses: actions/checkout@v4
        with:
          repository: hangdingding/ten-framework
          ref: feat/breeze-tts-extension
          path: ten
          fetch-depth: 1
          submodules: recursive

      - name: Install extension into TEN
        run: |
          dst=ten/ai_agents/agents/ten_packages/extension/breeze_tts_python
          rm -rf "$dst"
          cp -r ext "$dst"
          rm -rf "$dst/.git"

      - name: Install lint imports
        run: python3 -m pip install --quiet aiohttp pydantic

      - name: Build agent deps (same as upstream CI)
        run: |
          cd ten/ai_agents
          git config --global --add safe.directory "$(pwd)"
          timeout 1800 task build-agent-deps

      - name: Format check (task check)
        run: |
          cd ten/ai_agents
          git config --global --add safe.directory "$(pwd)"
          task check

      - name: Lint (task lint-extension)
        run: |
          cd ten/ai_agents
          task lint-extension EXTENSION=breeze_tts_python
